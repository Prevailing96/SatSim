# SatSim default scenario configuration
# -------------------------------------
# This file is intentionally conservative: short duration, single-step-friendly
# settings, and references to sibling config fragments.
#
# Ground targets (see TwoBodyEnvironment.default_demo_targets) are placed by
# geographic coordinates on the constellation's shared ground track, each
# ~25 degrees of true anomaly ahead of one satellite's starting position —
# so nothing is trivially under a satellite at t=0. With this duration/step,
# each satellite discovers its own target around t=385-412s. Target/sensor
# config wiring from this YAML (below) is not implemented yet; the demo
# scene is currently built in code.

name: default_leo_demo

simulation:
  duration_s: 600.0
  dt_s: 1.0
  seed: 42
  # epoch: "2026-01-01T00:00:00Z"   # civil epoch (infra conversion later)

constellation: configs/constellation/walker_delta_example.yaml
sensors: configs/sensors/eo_tof_pair.yaml
vision: configs/vision/default_perception.yaml

logging:
  level: INFO
  export_dir: outputs/default_leo_demo

# Closed-loop flags (application will honor these as features land)
autonomy:
  enable_cv_tasking: true
  min_detection_confidence: 0.5
  reactive_classes:
    - vessel
    - aircraft
    - anomaly
